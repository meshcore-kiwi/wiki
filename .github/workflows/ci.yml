name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No em-dashes in content
        run: |
          if grep -rn $'—' src/content/docs/; then
            echo "::error::Em-dashes found - use '-' instead (see CONTRIBUTING.md)"
            exit 1
          fi
      - name: No unofficial MeshCore domains
        run: |
          if grep -rni 'meshcore\.co\.uk' src/; then
            echo "::error::meshcore.co.uk is not an official domain - use meshcore.io"
            exit 1
          fi

  # Without this, merging a contributor's PR changed the repo but never the
  # site. Only runs on main, and only once build and style have passed.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build, style]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply wiki_users --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy Worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
